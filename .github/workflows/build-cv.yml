name: Build CVs

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/build_cv.py"
      - ".github/workflows/build-cv.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright python-docx cryptography
      - run: python -m playwright install --with-deps chromium
      - name: Render the public CV, and the private CVs encrypted when the CV_PASSWORD secret is set
        env:
          CV_PASSWORD: ${{ secrets.CV_PASSWORD }}
        run: |
          if [ -n "$CV_PASSWORD" ]; then
            python tools/build_cv.py --pdf --encrypt
          else
            echo "CV_PASSWORD secret not set: building the public CV only"
            python tools/build_cv.py --pdf
          fi
      - name: Commit CVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A cv
          git commit -m "Rebuild CV PDFs" || echo "No changes"
          git pull --rebase
          git push
